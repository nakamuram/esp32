; PlatformIO プロジェクト設定
; Freenove ESP32 WROOM Board (FNK0090 / ESP32-WROOM-32)
;
; 本体ファームウェア:
;   pio run -d firmware -t upload
; センサー特定用の診断スケッチ:
;   pio run -d firmware -e sensor-scan -t upload
;
; 設定項目のリファレンス: https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino

; シリアル速度。スケッチの Serial.begin() と一致させること
monitor_speed = 115200

; 書き込み速度。CH340 は 921600 では失敗するため 460800 に下げている
upload_speed = 460800

; 例外発生時のスタックトレースをデコードして表示する
monitor_filters = esp32_exception_decoder

; 依存ライブラリはここにバージョン付きで記載する（再現性の担保）
; lib_deps =
;   knolleary/PubSubClient@^2.8

[env:esp32dev]
; 本体。診断用スケッチはビルド対象から除く
build_src_filter = +<*> -<diagnostics/>

[env:sensor-scan]
; センサー特定用。main.cpp はビルドしない
build_src_filter = +<diagnostics/sensor_scan.cpp>
