; PlatformIO プロジェクト設定
; Freenove ESP32 WROOM Board (FNK0090 / ESP32-WROOM-32)
;
; ビルド        : pio run -d firmware
; 書き込み      : pio run -d firmware -t upload
; シリアル監視  : pio device monitor
;
; 設定項目のリファレンス: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; シリアル速度。src/main.cpp の Serial.begin() と一致させること
monitor_speed = 115200

; 書き込み速度。不安定な場合は 460800 や 115200 に下げる
upload_speed = 460800

; 例外発生時のスタックトレースをデコードして表示する
monitor_filters = esp32_exception_decoder

; 依存ライブラリはここにバージョン付きで記載する（再現性の担保）
; lib_deps =
;   knolleary/PubSubClient@^2.8
